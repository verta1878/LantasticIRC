# ============================================================================
# PCBBLDBT.CONF - DOSBox-X launcher config for the lantirc6 build root
#
# Mounts the build rootlantirc6  (BUILDROOT/) as pass-through C: and boots
# DOSBox-X's built-in DOS. No .IMG file needed — the build tree lives as
# real host files under lantirc6/BUILDROOT/, so edits on either side (host
# editor or in-DOS) are immediately visible to the other.
#
# Bundled paths (all relative to the toolchain/ dir, which is this
# config's parent):
#   lantirc6/BUILDROOT/  - lantirc6 build root: BC31, MSC70, TC201, HX, CWSDPMI, D32A,
#                        386MAX_S/, PCB153/, TOOLKIT/, BUILD/, SCRIPTS/, AUTOEXEC.BAT
#                        + CONFIG.SYS multi-boot menu. Mounts as C:.
#   ../KERNEL.SYS + ../FDCONFIG.SYS + ../FDAUTO.BAT + ../FDOS/
#                      - FreeDOS 1.3 boot-floppy contents (flat at toolchain/
#                        root). Not used by default AUTOEXEC below; used only
#                        by the optional real-boot flow (see lantirc6/README.md).
#   ../FDBOOT.IMG      - built on demand from those files by ../SETUP.SH
#                        --make-floppy. Also for the real-boot flow only.
#
# Launch from the toolchain/ dir with:
#   ./dosbox-x -conf lantirc6/PCBBLDBT.CONF        (Linux)
#   dosbox-x.exe -conf lantirc6\PCBBLDBT.CONF      (Windows)
# ============================================================================

[dosbox]
memsize=64
title=lantirc6-pcbbldbt

[cpu]
cputype=pentium
cycles=max

[dos]
ver=7.10
# --- CRITICAL: DOSBox-X uses INT 68h internally by default, which collides
# --- with HX HDPMI32/HDPMI16 and any other DPMI host that hooks INT 68h.
# --- Setting this to true frees INT 68h for guest-side use.
# --- Resolves Failure #1 in todo/dosboxx-dpmi-failures.md in lantirc6 repo.
zero unused int 68h=true

[sblaster]
sbtype=none
[gus]
gus=false
[speaker]
pcspeaker=false
disney=false
tandy=off

[autoexec]
mount c lantirc6/BUILDROOT
C:
CD \
ECHO lantirc6 build root mounted as C:
