# ============================================================================
# 386max-devices.conf — DOSBox-X 2026.06+ config for 386max Phase B testing
#
# Uses the new [devices] section (2026.06+) to load 386MAX.SYS as a guest
# DOS device driver at startup, without needing to go through QEMU/86Box/PCem.
#
# Untested — verify before committing. See todo/386max-build-downgrade.md.
# ============================================================================

[dosbox]
memsize=64
title=lantirc6-386max-test

[cpu]
cputype=pentium
cycles=max

[dos]
ver=7.10
# 386MAX will provide DPMI 0.9 once loaded; keep INT 68h free for it
zero unused int 68h=true

[sblaster]
sbtype=none

[devices]
# Load built 386MAX.SYS at startup, like DEVICE= in CONFIG.SYS.
# Path is guest-side (inside the mounted image).
DEVICE=C:\386MAX\386MAX.SYS
# Args to 386MAX.SYS go on same line if needed, e.g.:
#DEVICE=C:\386MAX\386MAX.SYS EMM=0 HMA=YES

[autoexec]
imgmount 0 /tmp/goldimg/fdboot_launch.img -t floppy
imgmount 2 /tmp/goldimg/PCBBLDBT.IMG -t hdd -fs none -size 512,63,16,195
boot -l a
